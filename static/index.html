<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trading Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e14; color:#d5dce5; font-family:'Segoe UI',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; background:#0d1420; border-bottom:1px solid #1c2942; }
  header h1 { font-size:16px; letter-spacing:2px; color:#7c8aff; }
  header h1 span { color:#3ddc84; }
  header .sub { font-size:11px; color:#5b6b85; }
  header .right { margin-left:auto; display:flex; gap:14px; align-items:center; font-size:12px; color:#8b98ad; }
  .pill { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.live { background:#123a24; color:#3ddc84; }
  .pill.busy { background:#3a2f12; color:#ffcf4d; }
  main { flex:1; display:grid; grid-template-columns:250px 1fr 300px; min-height:0; }
  /* watchlist */
  #watch { border-right:1px solid #1c2942; overflow-y:auto; background:#0b101a; }
  #watch h3, #research h3 { padding:10px 12px; font-size:11px; letter-spacing:1.5px; color:#5b6b85; border-bottom:1px solid #1c2942; position:sticky; top:0; background:#0b101a; }
  .coin { display:grid; grid-template-columns:1fr auto; padding:8px 12px; cursor:pointer; border-bottom:1px solid #131c2e; font-size:13px; }
  .coin:hover { background:#131c2e; }
  .coin.sel { background:#16223a; border-left:3px solid #7c8aff; }
  .coin .s { font-weight:700; }
  .coin .p { color:#8b98ad; font-size:11px; }
  .coin .ch { text-align:right; font-weight:600; }
  .up { color:#3ddc84; } .dn { color:#ff5c5c; }
  .coin .sc { display:block; font-size:10px; color:#5b6b85; text-align:right; }
  /* chart */
  #chartwrap { position:relative; min-width:0; display:flex; flex-direction:column; }
  #charthead { display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid #1c2942; }
  #charthead .sym { font-size:18px; font-weight:800; }
  #charthead .px { font-size:18px; }
  #chart { flex:1; min-height:0; }
  #fcstatus { font-size:11px; color:#5b6b85; }
  /* research */
  #research { border-left:1px solid #1c2942; overflow-y:auto; background:#0b101a; }
  .verdict { margin:12px; padding:14px; border-radius:10px; text-align:center; background:#111a2c; border:1px solid #1c2942; }
  .verdict .v { font-size:26px; font-weight:800; letter-spacing:2px; }
  .verdict.BUY .v { color:#3ddc84; } .verdict.SELL .v { color:#ff5c5c; } .verdict.HOLD .v { color:#ffcf4d; }
  .verdict .c { font-size:11px; color:#8b98ad; margin-top:4px; }
  .gauge { margin:0 12px 12px; padding:12px; background:#111a2c; border-radius:10px; border:1px solid #1c2942; }
  .gauge .lbl { font-size:11px; color:#8b98ad; margin-bottom:6px; display:flex; justify-content:space-between;}
  .bar { height:8px; border-radius:4px; background:#1c2942; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#ff5c5c,#ffcf4d,#3ddc84); }
  .analyst { margin:0 12px 10px; padding:10px 12px; background:#111a2c; border-radius:10px; border:1px solid #1c2942; }
  .analyst .hd { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:6px; }
  .badge { font-size:10px; padding:2px 8px; border-radius:10px; font-weight:700; }
  .badge.bull { background:#123a24; color:#3ddc84; } .badge.bear { background:#3a1a1a; color:#ff5c5c; } .badge.neutral { background:#2a2f3a; color:#8b98ad; }
  .analyst ul { font-size:11px; color:#8b98ad; padding-left:16px; }
  .analyst li { margin:2px 0; }
  #feed { border-top:1px solid #1c2942; max-height:150px; overflow-y:auto; padding:8px 14px; font-size:11px; color:#5b6b85; background:#0b101a;}
  #feed div { padding:2px 0; border-bottom:1px dashed #162032; }
  @media (max-width:1100px){ main{grid-template-columns:200px 1fr 260px;} }
</style>
</head>
<body>
<header>
  <h1>AI <span>TRADING TERMINAL</span></h1>
  <span class="sub">Kronos · TradingAgents · REA</span>
  <div class="right">
    <span id="clock"></span>
    <span class="pill live" id="statuspill">LIVE</span>
  </div>
</header>
<main>
  <div id="watch"><h3>MARKET ACTIVITY</h3><div id="coinlist"><div style="padding:12px;color:#5b6b85;font-size:12px">scanning market…</div></div></div>
  <div id="chartwrap">
    <div id="charthead">
      <span class="sym" id="sym">BTC</span>
      <span class="px" id="px">—</span>
      <span id="fcstatus">Kronos forecast: —</span>
    </div>
    <div id="chart"></div>
    <div id="feed"></div>
  </div>
  <div id="research"><h3>AI RESEARCH TEAM</h3><div id="panel"><div style="padding:12px;color:#5b6b85;font-size:12px">select a coin…</div></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
let chart, candleSeries, fcSeries = [], cur = 'BTC', coins = [];

function feed(msg){
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  const f = $('feed'); f.prepend(d);
  while(f.children.length > 40) f.lastChild.remove();
}
setInterval(()=>{ $('clock').textContent = new Date().toLocaleString(); }, 1000);

function initChart(){
  chart = LightweightCharts.createChart($('chart'), {
    layout:{ background:{color:'#0a0e14'}, textColor:'#8b98ad' },
    grid:{ vertLines:{color:'#131c2e'}, horzLines:{color:'#131c2e'} },
    timeScale:{ timeVisible:true, secondsVisible:false },
  });
  candleSeries = chart.addCandlestickSeries({ upColor:'#3ddc84', downColor:'#ff5c5c', wickUpColor:'#3ddc84', wickDownColor:'#ff5c5c', borderVisible:false });
  new ResizeObserver(es=>{ const r = es[0].contentRect; chart.applyOptions({width:r.width, height:r.height}); }).observe($('chart'));
}

async function loadActivity(){
  try{
    const r = await fetch('/api/activity?top=30');
    const d = await r.json();
    coins = d.coins || [];
    const el = $('coinlist'); el.innerHTML = '';
    coins.forEach((c,i)=>{
      const ch = c.pct_24h >= 0;
      const div = document.createElement('div');
      div.className = 'coin' + (c.symbol===cur ? ' sel' : '');
      div.innerHTML = `<div><span class="s">${c.symbol}</span> <span class="p">${fmtPx(c.price)}</span></div>
        <div><span class="ch ${ch?'up':'dn'}">${ch?'+':''}${c.pct_24h.toFixed(1)}%</span><span class="sc">act ${c.activity}</span></div>`;
      div.onclick = ()=>{ cur = c.symbol; document.querySelectorAll('.coin').forEach(x=>x.classList.remove('sel')); div.classList.add('sel'); selectCoin(); };
      el.appendChild(div);
    });
    feed(`market scan: ${d.universe} coins ranked`);
  }catch(e){ feed('activity scan failed: '+e.message); }
}
function fmtPx(p){ if(p==null) return '—'; if(p>=1000) return p.toLocaleString(undefined,{maximumFractionDigits:1}); if(p>=1) return p.toFixed(2); return p.toPrecision(4); }

async function loadCandles(){
  const r = await fetch(`/api/candles?coin=${cur}&tf=60`);
  const d = await r.json();
  if(d.error){ feed(cur+': '+d.error); return null; }
  const data = d.candles.map(c=>({ time:c.t, open:c.o, high:c.h, low:c.l, close:c.c }));
  candleSeries.setData(data);
  const last = data[data.length-1];
  $('sym').textContent = cur;
  $('px').textContent = '$'+fmtPx(last.close);
  $('px').className = 'px ' + (last.close>=last.open?'up':'dn');
  chart.timeScale().scrollToRealTime();
  return data;
}

async function loadForecast(){
  $('fcstatus').textContent = 'Kronos forecast: computing…';
  $('statuspill').textContent = 'BUSY'; $('statuspill').className = 'pill busy';
  try{
    const r = await fetch(`/api/forecast?coin=${cur}`);
    const d = await r.json();
    if(d.status === 'running' || d.status === 'pending'){ setTimeout(loadForecast, 8000); return; }
    if(d.status !== 'ready'){ $('fcstatus').textContent = 'Kronos forecast: unavailable'; return; }
    const res = d.result;
    fcSeries.forEach(s=>chart.removeSeries(s)); fcSeries = [];
    const mk = arr => res.timestamps.map((t,i)=>({time:t, value:arr[i]}));
    const p90 = chart.addLineSeries({color:'rgba(124,138,255,0.5)', lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
    const p10 = chart.addLineSeries({color:'rgba(124,138,255,0.5)', lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
    const med = chart.addLineSeries({color:'#ffffff', lineWidth:2, priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:false});
    p90.setData(mk(res.p90)); p10.setData(mk(res.p10)); med.setData(mk(res.median));
    fcSeries = [p90,p10,med];
    $('fcstatus').textContent = `Kronos forecast: P(up) ${Math.round(res.p_up*100)}% · exp ${res.exp_move_pct>=0?'+':''}${res.exp_move_pct}% / 24h`;
    feed(`Kronos ${cur}: P(up)=${Math.round(res.p_up*100)}%, exp ${res.exp_move_pct}%`);
  }catch(e){ $('fcstatus').textContent = 'Kronos forecast: error'; }
  $('statuspill').textContent = 'LIVE'; $('statuspill').className = 'pill live';
}

async function loadDebate(){
  const p = $('panel'); p.innerHTML = '<div style="padding:12px;color:#5b6b85;font-size:12px">analysts debating…</div>';
  try{
    const r = await fetch(`/api/debate?coin=${cur}`);
    const d = await r.json();
    if(d.error){ p.innerHTML = '<div style="padding:12px;color:#ff5c5c;font-size:12px">'+d.error+'</div>'; return; }
    let h = `<div class="verdict ${d.verdict}"><div class="v">${d.verdict}</div><div class="c">${d.note} · confidence ${Math.round(d.confidence*100)}%</div></div>`;
    d.analysts.forEach(a=>{
      h += `<div class="analyst"><div class="hd"><span>${a.analyst} Analyst</span><span class="badge ${a.stance}">${a.stance.toUpperCase()}</span></div><ul>`
        + a.reasons.map(x=>`<li>${x}</li>`).join('') + `</ul></div>`;
    });
    p.innerHTML = h;
    feed(`debate ${cur}: ${d.verdict} (${Math.round(d.confidence*100)}%)`);
  }catch(e){ p.innerHTML = '<div style="padding:12px;color:#ff5c5c;font-size:12px">debate failed</div>'; }
}

async function selectCoin(){ await loadCandles(); loadForecast(); loadDebate(); }

(async function(){
  initChart();
  await loadActivity();
  await selectCoin();
  setInterval(loadActivity, 5*60*1000);
  setInterval(async()=>{ await loadCandles(); loadDebate(); }, 5*60*1000);
})();
</script>
</body>
</html>
